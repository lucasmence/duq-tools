function getCurrentWord(text) {
  const match = text.match(/[a-zA-Z0-9_-]+$/);
  return match ? match[0] : '';
}

function getCompletionContext(text, cursorPos) {
  const beforeCursor = text.slice(0, cursorPos);
  const lines = beforeCursor.split('\n');
  const currentLine = lines[lines.length - 1];
  
  // Get full current line
  const restOfText = text.slice(beforeCursor.lastIndexOf('\n') + 1);
  const fullLineEnd = restOfText.indexOf('\n');
  const fullLine = fullLineEnd === -1 ? restOfText : restOfText.slice(0, fullLineEnd);
  
  const trimmedLine = currentLine.trim();
  
  // ── Inside parentheses (function args) ──
  let parenDepth = 0;
  let lastOpenParen = -1;
  for (let i = 0; i < currentLine.length; i++) {
    if (currentLine[i] === '(') { parenDepth++; lastOpenParen = i; }
    if (currentLine[i] === ')') parenDepth--;
  }
  
  if (parenDepth > 0 && lastOpenParen >= 0) {
    const beforeParen = currentLine.slice(0, lastOpenParen).trim();
    const funcName = beforeParen.split(/\s+/).pop() || '';
    const afterLastParen = currentLine.slice(lastOpenParen + 1);
    const currentWord = getCurrentWord(afterLastParen);
    
    if (EVENT_TYPES.has(funcName)) {
      return { type: 'event-args', prefix: currentWord, items: NAMED_ARGS_EVENT };
    }
    if (CONDITION_TYPES.has(funcName)) {
      return { type: 'condition-args', prefix: currentWord, items: NAMED_ARGS_CONDITION };
    }
    if (ACTION_TYPES.has(funcName)) {
      return { type: 'action-args', prefix: currentWord, items: NAMED_ARGS_ACTION };
    }
    return { type: 'args', prefix: currentWord, items: ALL_NAMED_ARGS };
  }
  
  // ── Meta key (@ prefix) ──
  if (trimmedLine.startsWith('@')) {
    const afterAt = trimmedLine.slice(1);
    const word = afterAt.match(/^[a-zA-Z_-]*/)?.[0] || '';
    return { type: 'meta', prefix: word, items: META_KEYS };
  }
  
  // ── Get current word and text before it ──
  const currentWord = getCurrentWord(beforeCursor);
  if (!currentWord && !trimmedLine.endsWith(' ') && !trimmedLine.endsWith('@')) {
    return null;
  }
  
  const textBeforeWord = beforeCursor.slice(0, beforeCursor.length - currentWord.length).trimEnd();
  
  // After "on " → event types (also if just typed "on" and a space)
  if (/\bon$/.test(textBeforeWord) && /^\s*on\s+/.test(currentLine)) {
    return { type: 'event', prefix: currentWord, items: [...EVENT_TYPES] };
  }
  
  // After "if", "and", "or" → condition types
  if (/\b(if|and|or)$/.test(textBeforeWord)) {
    return { type: 'condition', prefix: currentWord, items: [...CONDITION_TYPES] };
  }
  
  // In action section (indented line, after then:)
  const leadingSpace = fullLine.match(/^(\s*)/)[1];
  const trimmedFull = fullLine.trim();
  if (leadingSpace.length >= 4 && !trimmedFull.startsWith('//') && !trimmedFull.startsWith('@') &&
      !/^if\s/.test(trimmedFull) && trimmedFull !== 'then:' && !trimmedFull.startsWith('then:')) {
    const lineBeforeCursor = currentLine;
    const wordOnLine = lineBeforeCursor.match(/[a-zA-Z_-][a-zA-Z0-9_-]*$/);
    if (wordOnLine) {
      return { type: 'action', prefix: currentWord, items: [...ACTION_TYPES] };
    }
  }
  
  return null;
}

function filterAutocompleteItems(items, prefix) {
  if (!prefix) return [...items].sort();
  const lower = prefix.toLowerCase();
  return items.filter(item => item.toLowerCase().startsWith(lower)).sort();
}

function getTypeLabel(type) {
  const labels = {
    'event': ['event', 'EVENT'],
    'condition': ['condition', 'COND'],
    'action': ['action', 'ACT'],
    'meta': ['meta', 'META'],
    'event-args': ['arg', 'ARG'],
    'condition-args': ['arg', 'ARG'],
    'action-args': ['arg', 'ARG'],
    'args': ['arg', 'ARG']
  };
  return labels[type] || ['', ''];
}

// ================================================================
//  SYNTAX HIGHLIGHTER (single-pass tokenizer — no regex overlaps)
// ================================================================

function highlightLine(line) {
  // Returns HTML for a single line. No lookbehind used.
  const html = [];

  // Check for comment
  const commentIdx = line.indexOf('//');
  let codePart = line;
  let commentPart = '';
  if (commentIdx !== -1) {
    codePart = line.slice(0, commentIdx);
    commentPart = line.slice(commentIdx);
  }

  // Tokenize codePart
  let i = 0;
  const tokens = [];

  while (i < codePart.length) {
    // String literal
    if (codePart[i] === '"') {
      let j = i + 1;
      while (j < codePart.length && codePart[j] !== '"') {
        if (codePart[j] === '\\') j++;
        j++;
      }
      if (j < codePart.length) j++; // closing quote
      tokens.push({ type: 'string', text: codePart.slice(i, j) });
      i = j;
      continue;
    }

    // Number
    if (/[0-9]/.test(codePart[i]) && (i === 0 || /[\s,()]/.test(codePart[i-1]))) {
      let j = i;
      let hasDot = false;
      while (j < codePart.length && /[0-9.]/.test(codePart[j])) {
        if (codePart[j] === '.') hasDot = true;
        j++;
      }
      tokens.push({ type: 'number', text: codePart.slice(i, j) });
      i = j;
      continue;
    }

    // Named key (word followed by colon) — before generic word detection
    if (/[a-zA-Z_-]/.test(codePart[i])) {
      let j = i;
      while (j < codePart.length && /[a-zA-Z_-]/.test(codePart[j])) j++;
      if (j < codePart.length && codePart[j] === ':') {
        const word = codePart.slice(i, j);
        if (word !== 'then') {
          j++; // include colon
          tokens.push({ type: 'named-key', text: codePart.slice(i, j) });
          i = j;
          continue;
        }
      }
    }

    // Word (identifier)
    if (/[a-zA-Z_]/.test(codePart[i])) {
      let j = i;
      while (j < codePart.length && /[a-zA-Z0-9_-]/.test(codePart[j])) j++;
      const word = codePart.slice(i, j);
      const prevChar = i > 0 ? codePart[i-1] : ' ';
      const nextChar = j < codePart.length ? codePart[j] : ' ';

      // Determine word type based on context
      const wordType = classifyWord(word, prevChar, nextChar, i, codePart);
      tokens.push({ type: wordType, text: word });
      i = j;
      continue;
    }

    // Boolean
    if (codePart.slice(i, i+4) === 'true' && !/[a-zA-Z0-9_-]/.test(codePart[i+4]||'')) {
      tokens.push({ type: 'boolean', text: 'true' });
      i += 4;
      continue;
    }
    if (codePart.slice(i, i+5) === 'false' && !/[a-zA-Z0-9_-]/.test(codePart[i+5]||'')) {
      tokens.push({ type: 'boolean', text: 'false' });
      i += 5;
      continue;
    }

    // Operators
    if (codePart[i] === '(' || codePart[i] === ')' || codePart[i] === ',' || codePart[i] === ':') {
      tokens.push({ type: 'punctuation', text: codePart[i] });
      i++;
      continue;
    }

    // Other chars
    tokens.push({ type: 'plain', text: codePart[i] });
    i++;
  }

  // Build HTML
  for (const t of tokens) {
    const cls = t.type !== 'plain' ? ` class="${t.type}"` : '';
    html.push(`<span${cls}>${escapeHtml(t.text)}</span>`);
  }

  if (commentPart) {
    html.push(`<span class="comment">${escapeHtml(commentPart)}</span>`);
  }

  return html.join('');
}

function classifyWord(word, prevChar, nextChar, idx, fullLine) {
  // Metadata key
  if (prevChar === '@') return 'meta-key';

  // Keyword 'on', 'if', 'then'
  if (word === 'on' || word === 'if' || word === 'then') return 'keyword';

  // 'and', 'or'
  if (word === 'and' || word === 'or' || word === 'not') return 'operator';

  // Event type: after 'on'
  if (word !== 'on' && prevChar === ' ' && /on\s*$/.test(fullLine.slice(0, idx).trimEnd()) &&
      EVENT_TYPES.has(word)) return 'event-type';

  // Condition type: after 'if', 'and', or 'or' and followed by '('
  if (CONDITION_TYPES.has(word) && nextChar === '(') {
    const before = fullLine.slice(0, idx).trimEnd();
    if (/if$|and$|or$/.test(before) || /\(\s*$/.test(before)) return 'condition-type';
  }

  // Action type: at the start of a line (indented) and followed by '('
  if (ACTION_TYPES.has(word) && nextChar === '(') {
    const leading = fullLine.slice(0, idx);
    if (leading.trim() === '' || leading.trim() === 'then:') return 'action-type';
  }

  return 'plain';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightText(text) {
  const lines = text.split('\n');
  const out = lines.map(line => highlightLine(line));
  return out.join('\n');
}

// ================================================================
//  GUTTER
// ================================================================

function updateGutter(text) {
  const lines = text.split('\n');
  gutter.innerHTML = lines.map((_, i) => {
    const lineNum = i + 1;
    const errs = state.compileErrors[lineNum];
    let cls = 'gutter-line';
    let marker = '';
    if (errs && errs.length > 0) {
      const hasError = errs.some(e => e.type === 'error');
      cls += hasError ? ' has-error' : ' has-warning';
      marker = hasError ? '✗' : '⚠';
    }
    return `<div class="${cls}" data-line="${lineNum}">${marker}${i + 1}</div>`;
  }).join('');
}

// ================================================================
//  INDENT GUIDES
// ================================================================

function updateIndentGuides(text) {
  const lines = text.split('\n');
  const tabSize = 4;
  let maxIndent = 0;
  for (const line of lines) {
    const indent = line.search(/\S/);
    if (indent > 0) {
      const levels = Math.floor(indent / tabSize);
      if (levels > maxIndent) maxIndent = levels;
    }
  }

  if (maxIndent === 0) {
    indentGuides.innerHTML = '';
    return;
  }

  const approxCharWidth = 8.4; // approximate for monospace
  let html = '';
  for (let level = 1; level <= maxIndent; level++) {
    const x = (level * tabSize * approxCharWidth) + 12;
    html += `<div style="position:absolute;top:0;left:${x}px;width:1px;height:100%;background:var(--indent-guide);pointer-events:none;z-index:1"></div>`;
  }
  indentGuides.innerHTML = html;
}

// ================================================================
//  PARSER — Pseudo-language → IR
// ================================================================

function parseArgs(str) {
  const args = [];
  let i = 0;
  let current = '';
  let inString = false;
  let depth = 0;

  function pushArg() {
    const trimmed = current.trim();
    if (trimmed === '') return;
    const namedMatch = trimmed.match(/^([a-zA-Z_-]+):\s*(.*)/);
    if (namedMatch) {
      args.push({ type: 'named', key: namedMatch[1], value: parseValue(namedMatch[2].trim()) });
    } else {
      args.push({ type: 'value', value: parseValue(trimmed) });
    }
    current = '';
  }

  while (i < str.length) {
    const ch = str[i];
    if (ch === '"' && (i === 0 || str[i-1] !== '\\')) {
      inString = !inString;
      current += ch;
    } else if (!inString && ch === '(') {
      depth++;
      current += ch;
    } else if (!inString && ch === ')') {
      depth--;
      current += ch;
    } else if (!inString && ch === ',' && depth === 0) {
      pushArg();
    } else {
      current += ch;
    }
    i++;
  }
  if (current.trim()) pushArg();
  return args;
}

function parseValue(str) {
  str = str.trim();
  if ((str.startsWith('"') && str.endsWith('"')) || (str.startsWith("'") && str.endsWith("'"))) {
    return { type: 'string', value: str.slice(1, -1) };
  }
  if (str === 'true') return { type: 'boolean', value: true };
  if (str === 'false') return { type: 'boolean', value: false };
  if (/^-?\d+$/.test(str)) return { type: 'integer', value: parseInt(str, 10) };
  if (/^-?\d+\.\d+$/.test(str)) return { type: 'float', value: parseFloat(str) };
  return { type: 'string', value: str };
}

function parseEventArgs(args) {
  const obj = {};
  for (const arg of args) {
    if (arg.type === 'named') {
      switch (arg.key) {
        case 'unit': case 'unitName': obj.unitName = arg.value.value; break;
        case 'range': case 'float': obj.floatValue = arg.value.value; break;
        case 'id': case 'int': case 'integer': obj.integerValue = arg.value.value; break;
        case 'text': obj.text = arg.value.value; break;
        default:
          if (arg.value.type === 'string' && !obj.unitName) obj.unitName = arg.value.value;
          else if ((arg.value.type === 'float' || arg.value.type === 'integer') && !obj.floatValue) obj.floatValue = arg.value.value;
          break;
      }
    } else {
      if (arg.value.type === 'string' && !obj.unitName) obj.unitName = arg.value.value;
      else if ((arg.value.type === 'float' || arg.value.type === 'integer') && !obj.floatValue) obj.floatValue = arg.value.value;
    }
  }
  return obj;
}

function parseConditionArgs(args) {
  const obj = { strings: [], integers: [], floats: [], booleans: [] };
  for (const arg of args) {
    if (arg.type === 'named') {
      switch (arg.key) {
        case 'unit': case 'unitName': obj.unitName = arg.value.value; break;
        case 'float': obj.floatValue = arg.value.value; break;
        case 'int': case 'integer': obj.integerValue = arg.value.value; break;
        case 'text': obj.text = arg.value.value; break;
        default:
          if (arg.value.type === 'string') obj.strings.push({ value: arg.value.value });
          else if (arg.value.type === 'integer') obj.integers.push({ value: arg.value.value });
          else if (arg.value.type === 'float') obj.floats.push({ value: arg.value.value });
          else if (arg.value.type === 'boolean') obj.booleans.push({ value: arg.value.value });
          break;
      }
    } else {
      if (arg.value.type === 'string') obj.strings.push({ value: arg.value.value });
      else if (arg.value.type === 'integer') obj.integers.push({ value: arg.value.value });
      else if (arg.value.type === 'float') obj.floats.push({ value: arg.value.value });
      else if (arg.value.type === 'boolean') obj.booleans.push({ value: arg.value.value });
    }
  }
  return obj;
}

function parseActionArgs(args) {
  const obj = { strings: [], integers: [], floats: [], booleans: [], activated: true, singleThread: true };
  for (const arg of args) {
    if (arg.type === 'named') {
      switch (arg.key) {
        case 'unit': case 'unitName': obj.unitName = arg.value.value; break;
        case 'float': obj.floatValue = arg.value.value; break;
        case 'int': case 'integer': obj.integerValue = arg.value.value; break;
        case 'text': obj.text = arg.value.value; break;
        case 'active': case 'activated': obj.activated = arg.value.value; break;
        case 'single': obj.singleThread = arg.value.value; break;
        default:
          if (arg.value.type === 'string') obj.strings.push({ value: arg.value.value });
          else if (arg.value.type === 'integer') obj.integers.push({ value: arg.value.value });
          else if (arg.value.type === 'float') obj.floats.push({ value: arg.value.value });
          else if (arg.value.type === 'boolean') obj.booleans.push({ value: arg.value.value });
          break;
      }
    } else {
      if (arg.value.type === 'string') obj.strings.push({ value: arg.value.value });
      else if (arg.value.type === 'integer') obj.integers.push({ value: arg.value.value });
      else if (arg.value.type === 'float') obj.floats.push({ value: arg.value.value });
      else if (arg.value.type === 'boolean') obj.booleans.push({ value: arg.value.value });
    }
  }
  return obj;
}

function parseFullScript(text) {
  const lines = text.split('\n');
  const triggers = [];
  const metadataRaw = [];
  let i = 0;

  while (i < lines.length) {
    const trimmed = lines[i].trim();

    if (trimmed === '' || trimmed.startsWith('//')) {
      i++;
      continue;
    }

    if (trimmed.startsWith('@')) {
      metadataRaw.push({ raw: lines[i], index: i });
      i++;
      // Collect continuation lines (indented or list items)
      while (i < lines.length) {
        const nextTrimmed = lines[i].trim();
        if (nextTrimmed === '' || nextTrimmed.startsWith('//')) { i++; continue; }
        if (nextTrimmed.startsWith('@') || nextTrimmed.startsWith('on ')) break;
        metadataRaw.push({ raw: lines[i], index: i });
        i++;
      }
      continue;
    }

    if (trimmed.startsWith('on ')) {
      const block = parseTriggerBlock(lines, i);
      if (block) {
        triggers.push(block);
        i = block.lineEnd;
      } else { i++; }
    } else {
      i++;
    }
  }

  return { triggers, metadataRaw };
}

function parseTriggerBlock(lines, startIdx) {
  const block = {
    events: [],
    conditions: [],
    then: [],
    conditionGroup: 'and',
    lineStart: startIdx,
    lineEnd: startIdx
  };
  let i = startIdx;

  // Parse "on <event-type>(<args>)"
  const onLine = lines[i].trim();
  const onMatch = onLine.match(/^on\s+([a-zA-Z_-]+)\s*(?:\(([^)]*)\))?\s*(?:\/\/.*)?$/);
  if (!onMatch) return null;

  const eventType = onMatch[1];
  const eventArgsStr = onMatch[2] || '';
  const eventObj = { event: eventType, ...parseEventArgs(parseArgs(eventArgsStr)) };
  block.events.push(eventObj);
  i++;
  block.lineEnd = i;

  // Parse conditions
  while (i < lines.length) {
    const trimmed = lines[i].trim();
    if (trimmed === '' || trimmed.startsWith('//')) { i++; continue; }

    if (trimmed.startsWith('if ')) {
      const ifContent = trimmed.slice(3).trim();
      // Split by ' and ' or ' or ' (preserving separators)
      const parts = ifContent.split(/\s+(and|or)\s+/);
      for (let p = 0; p < parts.length; p++) {
        const part = parts[p].trim();
        if (part === 'and' || part === 'or') {
          block.conditionGroup = part;
          continue;
        }
        const condMatch = part.match(/^([a-zA-Z_-]+)\s*(?:\(([^)]*)\))?\s*(?:\/\/.*)?$/);
        if (condMatch) {
          const condType = condMatch[1];
          const condArgsStr = condMatch[2] || '';
          const condObj = { condition: condType, ...parseConditionArgs(parseArgs(condArgsStr)) };
          block.conditions.push(condObj);
        }
      }
      i++;
      continue;
    }

    if (trimmed === 'then:' || trimmed.startsWith('then:')) { i++; break; }
    if (trimmed.startsWith('@') || trimmed.startsWith('on ')) break;
    if (!trimmed.startsWith('if ')) break; // unknown line type
    i++;
  }

  // Skip blanks after "then:"
  while (i < lines.length && lines[i].trim() === '') i++;

  // Parse actions
  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();
    if (trimmed === '' || trimmed.startsWith('//')) { i++; continue; }

    const indent = line.search(/\S/);
    if (indent < 4 || trimmed.startsWith('@') || trimmed.startsWith('on ') ||
        trimmed.startsWith('if ') || trimmed === 'then:') break;

    const actionMatch = trimmed.match(/^([a-zA-Z_-]+)\s*(?:\(([^)]*)\))?\s*(?:\/\/.*)?$/);
    if (!actionMatch) { i++; continue; }

    const actionType = actionMatch[1];
    const actionArgsStr = actionMatch[2] || '';
    const actionObj = { action: actionType, ...parseActionArgs(parseArgs(actionArgsStr)) };
    block.then.push(actionObj);
    i++;
  }

  block.lineEnd = i;
  return block;
}

// ================================================================
//  JSON → Pseudo-language Generator
// ================================================================

function jsonToPseudo(jsonObj) {
  const lines = [];
  let first = true;

  const fmt = v => {
    if (typeof v === 'string') return `"${v}"`;
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return String(v);
  };

  const fmtArgs = (obj, specialFields) => {
    const parts = [];
    for (const [k, v] of Object.entries(specialFields)) {
      if (v !== undefined && v !== null && v !== '' && v !== 0) {
        parts.push(`${k}: ${fmt(v)}`);
      }
    }
    if (obj.strings) obj.strings.forEach(s => parts.push(fmt(s.value)));
    if (obj.integers) obj.integers.forEach(n => parts.push(fmt(n.value)));
    if (obj.floats) obj.floats.forEach(f => parts.push(fmt(f.value)));
    if (obj.booleans) obj.booleans.forEach(b => parts.push(fmt(b.value)));
    return parts.join(', ');
  };

  const fmtEventArgs = evt => fmtArgs(evt, {
    unit: evt.unitName || undefined,
    range: evt.floatValue || undefined,
    id: evt.integerValue || undefined,
    text: evt.text || undefined
  });

  const fmtConditionArgs = cond => fmtArgs(cond, {
    unit: cond.unitName || undefined,
    float: cond.floatValue || undefined,
    int: cond.integerValue || undefined,
    text: cond.text || undefined
  });

  const fmtActionArgs = action => fmtArgs(action, {
    unit: action.unitName || undefined,
    float: action.floatValue || undefined,
    int: action.integerValue || undefined,
    text: action.text || undefined,
    active: action.activated === false ? false : undefined,
    single: action.singleThread === false ? false : undefined
  });

  // ── Trigger blocks ──
  if (jsonObj.trigger && Array.isArray(jsonObj.trigger)) {
    for (const trig of jsonObj.trigger) {
      if (!first) lines.push('');
      first = false;

      for (const evt of (trig.events || [])) {
        const args = fmtEventArgs(evt);
        lines.push(args ? `on ${evt.event}(${args})` : `on ${evt.event}`);
      }

      if (trig.conditions && trig.conditions.length > 0) {
        const condStrs = trig.conditions.map(c => {
          const args = fmtConditionArgs(c);
          return args ? `${c.condition}(${args})` : c.condition;
        });
        let groupSep = ' and ';
        for (const c of trig.conditions) {
          if (c.conditionGroup === 'or') { groupSep = ' or '; break; }
        }
        lines.push(`    if ${condStrs.join(groupSep)}`);
      }

      if (trig.then && trig.then.length > 0) {
        lines.push('        then:');
        for (const action of trig.then) {
          const args = fmtActionArgs(action);
          lines.push(`            ${action.action}(${args})`);
        }
      }
    }
  }

  // ── Metadata ──
  const knownMeta = [
    'item-drop', 'item-drop-list', 'procedural', 'procedural-list',
    'procedural-room-size', 'procedural-exit-door', 'unit-spawn-range',
    'unit-spawn-limit', 'unit-spawn', 'merchant-spawn-chance', 'merchant-spawn',
    'exit', 'special-exits-chance', 'special-exits',
    'list-items-spawn',
    'list-food-spawn',
    'environments-drop', 'environments-drop-hit',
    'list-chests-spawn',
    'list-shrines-spawn',
    'musics'
  ];

  for (const key of knownMeta) {
    if (!(key in jsonObj)) continue;
    const val = jsonObj[key];
    if (!first) lines.push('');
    first = false;

    if (Array.isArray(val)) {
      if (val.length === 0) {
        lines.push('@' + key + ':');
      } else {
        // Check if all items are simple { value: ... } objects
        const allSimpleValues = val.every(item =>
          typeof item === 'object' && item !== null && Object.keys(item).length === 1 && 'value' in item
        );

        if (allSimpleValues) {
          const items = val.map(item => fmt(item.value));
          lines.push(`@${key}:[${items.join(',')}]`);
        } else {
          // Complex objects: use inline JSON (no dashes)
          lines.push(`@${key}: ${JSON.stringify(val)}`);
        }
      }
    } else if (typeof val === 'boolean') {
      lines.push(`@${key}: ${val}`);
    } else if (typeof val === 'number') {
      lines.push(`@${key}: ${val}`);
    } else if (typeof val === 'string') {
      lines.push(`@${key}: ${fmt(val)}`);
    } else if (typeof val === 'object' && val !== null) {
      lines.push('@' + key + ':');
      for (const [k, v] of Object.entries(val)) {
        lines.push(`    ${k}: ${fmt(v)}`);
      }
    }
  }

  // Remaining fields
  for (const [key, val] of Object.entries(jsonObj)) {
    if (key === 'trigger' || knownMeta.includes(key)) continue;
    if (!first) lines.push('');
    first = false;

    if (typeof val === 'boolean') lines.push(`@${key}: ${val}`);
    else if (typeof val === 'number') lines.push(`@${key}: ${val}`);
    else if (typeof val === 'string') lines.push(`@${key}: ${fmt(val)}`);
    else if (Array.isArray(val)) {
      const allSimpleValues = val.every(item =>
        typeof item === 'object' && item !== null && Object.keys(item).length === 1 && 'value' in item
      );
      if (allSimpleValues) {
        const items = val.map(item => fmt(item.value));
        lines.push(`@${key}:[${items.join(',')}]`);
      } else {
        lines.push(`@${key}: ${JSON.stringify(val)}`);
      }
    }
    else lines.push(`@${key}: ${JSON.stringify(val)}`);
  }

  return lines.join('\n');
}

// ================================================================
//  Pseudo-language → JSON Generator
// ================================================================

function pseudoToJson(text) {
  const parsed = parseFullScript(text);
  const result = { trigger: [], 'item-drop': [], 'item-drop-list': [] };

  // Triggers
  for (const block of parsed.triggers) {
    const trig = {};

    trig.events = block.events.map(evt => {
      const e = { event: evt.event };
      if (evt.floatValue !== undefined && evt.floatValue !== null) e.floatValue = evt.floatValue;
      if (evt.integerValue !== undefined && evt.integerValue !== null) e.integerValue = evt.integerValue;
      if (evt.unitName) e.unitName = evt.unitName;
      if (evt.text) e.text = evt.text;
      return e;
    });

    if (block.conditions.length > 0) {
      trig.conditions = block.conditions.map(cond => {
        const c = { condition: cond.condition };
        if (cond.strings && cond.strings.length) c.strings = cond.strings;
        if (cond.integers && cond.integers.length) c.integers = cond.integers;
        if (cond.floats && cond.floats.length) c.floats = cond.floats;
        if (cond.booleans && cond.booleans.length) c.booleans = cond.booleans;
        if (cond.integerValue !== undefined && cond.integerValue !== null && cond.integerValue !== 0) c.integerValue = cond.integerValue;
        if (cond.floatValue !== undefined && cond.floatValue !== null && cond.floatValue !== 0) c.floatValue = cond.floatValue;
        if (cond.unitName) c.unitName = cond.unitName;
        if (cond.text) c.text = cond.text;
        if (cond.conditionGroup === 'or') c.conditionGroup = 'or';
        return c;
      });
    }

    if (block.then.length > 0) {
      trig.then = block.then.map(action => {
        const a = { action: action.action };
        if (action.strings && action.strings.length) a.strings = action.strings;
        if (action.integers && action.integers.length) a.integers = action.integers;
        if (action.floats && action.floats.length) a.floats = action.floats;
        if (action.booleans && action.booleans.length) a.booleans = action.booleans;
        if (action.floatValue !== undefined && action.floatValue !== null) a.floatValue = action.floatValue;
        if (action.integerValue !== undefined && action.integerValue !== null) a.integerValue = action.integerValue;
        if (action.unitName) a.unitName = action.unitName;
        if (action.text) a.text = action.text;
        if (action.activated === false) a.activated = false;
        return a;
      });
    }

    result.trigger.push(trig);
  }

  // ── Metadata parsing ──
  const metaKeys = [
    'item-drop', 'item-drop-list', 'procedural', 'procedural-list',
    'procedural-room-size', 'procedural-exit-door', 'unit-spawn-range',
    'unit-spawn-limit', 'unit-spawn', 'merchant-spawn-chance', 'merchant-spawn',
    'exit', 'special-exits-chance', 'special-exits',
    'list-items-spawn',
    'list-food-spawn',
    'environments-drop', 'environments-drop-hit',
    'list-chests-spawn',
    'list-shrines-spawn',
    'musics'
  ];

  const lines = text.split('\n');
  let currentMetaKey = null;
  let metaItems = [];
  let currentObj = null;

  function flushMeta() {
    if (!currentMetaKey) return;
    if (!metaKeys.includes(currentMetaKey)) return;
    if (currentObj) metaItems.push(currentObj);
    currentObj = null;
    if (currentMetaKey === 'procedural') {
      if (metaItems.length === 1 && typeof metaItems[0] === 'boolean') result.procedural = metaItems[0];
    } else if (currentMetaKey === 'procedural-room-size' || currentMetaKey === 'unit-spawn-range' ||
               currentMetaKey === 'unit-spawn-limit' || currentMetaKey === 'merchant-spawn-chance' ||
               currentMetaKey === 'special-exits-chance') {
      if (metaItems.length >= 1 && typeof metaItems[0] === 'number') result[currentMetaKey] = metaItems[0];
    } else if (currentMetaKey === 'procedural-list' || currentMetaKey === 'procedural-exit-door' || currentMetaKey === 'exit') {
      if (metaItems.length >= 1 && typeof metaItems[0] === 'string') result[currentMetaKey] = metaItems[0];
    } else {
      result[currentMetaKey] = metaItems;
    }
    metaItems = [];
  }

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('@')) {
      flushMeta();
      currentMetaKey = null;
      const colonIdx = trimmed.indexOf(':');
      if (colonIdx === -1) continue;
      const key = trimmed.slice(1, colonIdx).trim();
      const valueStr = trimmed.slice(colonIdx + 1).trim();

      if (metaKeys.includes(key)) {
        currentMetaKey = key;
        metaItems = [];

        if (valueStr === 'true') { metaItems.push(true); }
        else if (valueStr === 'false') { metaItems.push(false); }
        else if (/^-?\d+\.?\d*$/.test(valueStr)) { metaItems.push(parseFloat(valueStr)); }
        else if (valueStr.startsWith('"') && valueStr.endsWith('"')) { metaItems.push(valueStr.slice(1, -1)); }
        else if (valueStr.startsWith('[') && valueStr.endsWith(']')) {
          if (valueStr.includes('{')) {
            // Complex nested objects — use JSON.parse
            try {
              const parsed = JSON.parse(valueStr);
              if (Array.isArray(parsed)) metaItems = parsed;
            } catch {
              // fallback: ignore parse failure
            }
          } else {
            // Simple values — comma-split to preserve {value: ...} wrapping
            const inner = valueStr.slice(1, -1);
            if (inner.trim()) {
              metaItems = inner.split(',').map(x => {
                const sv = parseSimpleValue(x.trim());
                return typeof sv === 'object' ? sv : { value: sv };
              });
            }
          }
        }

        currentObj = null;
      }
    } else if (trimmed.startsWith('- ') && currentMetaKey) {
      if (currentObj) metaItems.push(currentObj);
      currentObj = {};
      const afterDash = trimmed.slice(2).trim();
      if (afterDash && !afterDash.includes(':')) {
        metaItems.push(parseSimpleValue(afterDash));
        currentObj = null;
      }
    } else if (currentObj !== null && trimmed.includes(':')) {
      const colonIdx = trimmed.indexOf(':');
      const k = trimmed.slice(0, colonIdx).trim();
      let vStr = trimmed.slice(colonIdx + 1).trim();

      if (vStr.startsWith('[') && vStr.endsWith(']')) {
        const inner = vStr.slice(1, -1);
        currentObj[k] = inner.split(',').map(x => {
          const sv = parseSimpleValue(x.trim());
          return typeof sv === 'object' ? sv : { value: sv };
        });
      } else {
        currentObj[k] = parseSimpleValue(vStr);
      }
    } else if (currentMetaKey && trimmed !== '' && !trimmed.startsWith('//') && currentObj === null) {
      // Line continuation
      if (!trimmed.startsWith('-')) {
        const sv = parseSimpleValue(trimmed);
        metaItems.push(sv);
      }
    }
  }
  flushMeta();

  // Unknown metadata — try to preserve raw text
  for (const { raw } of parsed.metadataRaw) {
    const trimmed = raw.trim();
    if (!trimmed.startsWith('@')) continue;
    const colonIdx = trimmed.indexOf(':');
    if (colonIdx === -1) continue;
    const key = trimmed.slice(1, colonIdx).trim();
    if (key in result) continue; // already handled
    if (key === 'trigger') continue;
    const valueStr = trimmed.slice(colonIdx + 1).trim();

    if (valueStr === 'true') result[key] = true;
    else if (valueStr === 'false') result[key] = false;
    else if (/^-?\d+\.?\d*$/.test(valueStr)) result[key] = parseFloat(valueStr);
    else if (valueStr.startsWith('"') && valueStr.endsWith('"')) result[key] = valueStr.slice(1, -1);
    else if ((valueStr.startsWith('[') && valueStr.endsWith(']')) || (valueStr.startsWith('{') && valueStr.endsWith('}'))) {
      try {
        const parsed = JSON.parse(valueStr);
        result[key] = parsed;
      } catch {
        result[key] = valueStr;
      }
    } else result[key] = valueStr;
  }

  return result;
}

function parseSimpleValue(str) {
  str = str.trim();
  if (str.startsWith('"') && str.endsWith('"')) return str.slice(1, -1);
  if (str === 'true') return true;
  if (str === 'false') return false;
  const num = parseFloat(str);
  if (!isNaN(num)) return num;
  return str;
}

// ================================================================
//  AUTOCOMPLETE UI
// ================================================================

const autocompleteDropdown = $('autocompleteDropdown');
const autocompleteWrapper = $('autocompleteWrapper');

function getAutocompletePosition() {
  const text = codeInput.value;
  const pos = codeInput.selectionStart;
  const beforeCursor = text.slice(0, pos);
  const lines = beforeCursor.split('\n');
  const lineNum = lines.length;
  const colNum = lines[lines.length - 1].length;

  const lineHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-size')) *
                     parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--line-height'));
  const charWidth = 8.4;
  const paddingTop = 10;
  const paddingLeft = 16;

  const x = paddingLeft + colNum * charWidth - codeInput.scrollLeft;
  const y = paddingTop + (lineNum - 1) * lineHeight - codeInput.scrollTop + lineHeight;

  return { x, y };
}

function showAutocomplete(context) {
  const { type, prefix, items: rawItems } = context;
  const filtered = filterAutocompleteItems(rawItems, prefix);

  if (filtered.length === 0) {
    hideAutocomplete();
    return;
  }

  autocompleteState.active = true;
  autocompleteState.items = filtered;
  autocompleteState.selectedIndex = 0;
  autocompleteState.context = context;

  const [labelText, labelClass] = getTypeLabel(type);

  let html = '';
  for (let i = 0; i < filtered.length; i++) {
    const item = filtered[i];
    const selected = i === 0 ? ' selected' : '';
    const highlighted = prefix
      ? item.replace(new RegExp('^(' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i'), '<span class="match">$1</span>')
      : item;
    const tagHtml = labelClass ? `<span class="label-tag ${labelClass}">${labelText}</span>` : '';
    html += `<div class="autocomplete-item${selected}" data-index="${i}">${highlighted}${tagHtml}</div>`;
  }

  autocompleteDropdown.innerHTML = html;

  // Position
  const pos = getAutocompletePosition();
  autocompleteWrapper.style.left = Math.min(pos.x, editorWrapper.clientWidth - 200) + 'px';
  autocompleteWrapper.style.top = Math.min(pos.y, editorWrapper.clientHeight - 240) + 'px';
  autocompleteWrapper.style.display = 'block';
  autocompleteWrapper.classList.add('active');

  // Ensure selected item is visible
  const selectedEl = autocompleteDropdown.querySelector('.selected');
  if (selectedEl) {
    selectedEl.scrollIntoView({ block: 'nearest' });
  }
}

function hideAutocomplete() {
  autocompleteState.active = false;
  autocompleteState.items = [];
  autocompleteState.selectedIndex = 0;
  autocompleteState.context = null;
  autocompleteWrapper.style.display = 'none';
  autocompleteWrapper.classList.remove('active');
}

function selectAutocompleteNext() {
  if (!autocompleteState.active || autocompleteState.items.length === 0) return;
  autocompleteState.selectedIndex = (autocompleteState.selectedIndex + 1) % autocompleteState.items.length;
  updateAutocompleteSelection();
}

function selectAutocompletePrev() {
  if (!autocompleteState.active || autocompleteState.items.length === 0) return;
  autocompleteState.selectedIndex = (autocompleteState.selectedIndex - 1 + autocompleteState.items.length) % autocompleteState.items.length;
  updateAutocompleteSelection();
}

function updateAutocompleteSelection() {
  const items = autocompleteDropdown.querySelectorAll('.autocomplete-item');
  items.forEach((el, i) => {
    el.classList.toggle('selected', i === autocompleteState.selectedIndex);
  });
  const selectedEl = items[autocompleteState.selectedIndex];
  if (selectedEl) {
    selectedEl.scrollIntoView({ block: 'nearest' });
  }
}

function applyAutocomplete() {
  if (!autocompleteState.active || autocompleteState.items.length === 0) return false;

  const selected = autocompleteState.items[autocompleteState.selectedIndex];
  const text = codeInput.value;
  const pos = codeInput.selectionStart;
  const beforeCursor = text.slice(0, pos);
  const currentWord = getCurrentWord(beforeCursor);

  // Replace the current word with the selected completion
  const start = pos - currentWord.length;
  const end = pos;
  const insertText = selected;

  // Insert with proper spacing if needed
  let suffix = '';
  // If insertion is a function-like thing, add parentheses automatically
  if (EVENT_TYPES.has(selected) || CONDITION_TYPES.has(selected) || ACTION_TYPES.has(selected)) {
    suffix = '(';
  }
  // If it's a named argument, add space after colon
  if (selected.endsWith(':')) {
    suffix = ' ';
  }

  codeInput.value = text.slice(0, start) + insertText + suffix + text.slice(end);
  const newPos = start + insertText.length + suffix.length;
  codeInput.selectionStart = codeInput.selectionEnd = newPos;

  hideAutocomplete();
  syncEditor();
  return true;
}

function triggerAutocomplete() {
  const text = codeInput.value;
  const pos = codeInput.selectionStart;
  const context = getCompletionContext(text, pos);
  if (context && context.items && context.items.length > 0) {
    showAutocomplete(context);
  } else {
    hideAutocomplete();
  }
}

// ================================================================
//  EDITOR SYNC
// ================================================================

function syncEditor() {
  const text = codeInput.value;
  state.text = text;

  // Syntax highlighting
  codeOutput.innerHTML = highlightText(text) + '\n';

  // Gutter
  updateGutter(text);

  // Indent guides
  updateIndentGuides(text);

  // Status
  try {
    pseudoToJson(text);
    statusText.textContent = 'Ready';
    statusDot.className = 'status-dot ready';
    state.parseError = null;
    statusExtra.textContent = '';
  } catch (e) {
    statusText.textContent = 'Parse Error';
    statusDot.className = 'status-dot error';
    state.parseError = e.message;
    statusExtra.textContent = e.message;
  }

  updateCursorInfo();
}

function updateCursorInfo() {
  const text = codeInput.value;
  const pos = codeInput.selectionStart;
  const lines = text.substring(0, pos).split('\n');
  lineColInfo.textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
  charCount.textContent = `${text.length} chars`;
}

// ================================================================
//  EDITOR EVENTS
// ================================================================

codeInput.addEventListener('input', () => {
  syncEditor();
  // Trigger autocomplete after a small delay to let state settle
  clearTimeout(window._autoCompleteTimer);
  window._autoCompleteTimer = setTimeout(triggerAutocomplete, 30);
});

codeInput.addEventListener('scroll', () => {
  codeOutput.scrollTop = codeInput.scrollTop;
  gutter.scrollTop = codeInput.scrollTop;
  hideAutocomplete();
  hideGutterTooltip();
});

codeInput.addEventListener('blur', () => {
  // Delay hiding to allow click on autocomplete item
  setTimeout(() => {
    if (!autocompleteWrapper.matches(':hover')) {
      hideAutocomplete();
    }
  }, 150);
});

codeInput.addEventListener('click', () => {
  hideAutocomplete();
  updateCursorInfo();
});

codeInput.addEventListener('keyup', (e) => {
  if (!e.ctrlKey && !e.metaKey && !autocompleteState.active) {
    clearTimeout(window._autoCompleteTimer);
    window._autoCompleteTimer = setTimeout(triggerAutocomplete, 50);
  }
  updateCursorInfo();
});

// Click on autocomplete item
autocompleteDropdown.addEventListener('mousedown', (e) => {
  const item = e.target.closest('.autocomplete-item');
  if (item) {
    const index = parseInt(item.dataset.index, 10);
    autocompleteState.selectedIndex = index;
    updateAutocompleteSelection();
  }
});

autocompleteDropdown.addEventListener('click', (e) => {
  const item = e.target.closest('.autocomplete-item');
  if (item) {
    const index = parseInt(item.dataset.index, 10);
    autocompleteState.selectedIndex = index;
    applyAutocomplete();
    codeInput.focus();
  }
});

// ================================================================
//  GUTTER TOOLTIP — Show compile errors on hover
// ================================================================

let gutterTooltipEl = null;
let gutterTooltipTimer = null;

function showGutterTooltip(e) {
  const lineDiv = e.target.closest('.gutter-line');
  if (!lineDiv) return;
  const lineNum = parseInt(lineDiv.dataset.line, 10);
  if (!lineNum) return;
  const errs = state.compileErrors[lineNum];
  if (!errs || errs.length === 0) return;

  // Clear previous timer
  if (gutterTooltipTimer) clearTimeout(gutterTooltipTimer);

  // Remove existing tooltip
  if (gutterTooltipEl) gutterTooltipEl.remove();

  gutterTooltipEl = document.createElement('div');
  gutterTooltipEl.className = 'gutter-tooltip';

  let html = '';
  for (const err of errs) {
    const icon = err.type === 'error' ? '✗' : '⚠';
    html += `<div class="tooltip-line ${err.type}"><span class="tt-icon">${icon}</span><span class="tt-text">${escapeHtml(err.text)}</span></div>`;
  }
  gutterTooltipEl.innerHTML = html;
  document.body.appendChild(gutterTooltipEl);

  // Position tooltip near the gutter line
  const gutterRect = gutter.getBoundingClientRect();
  const lineRect = lineDiv.getBoundingClientRect();
  const tooltipRect = gutterTooltipEl.getBoundingClientRect();

  let top = lineRect.top - tooltipRect.height - 4;
  if (top < 4) top = lineRect.bottom + 4;
  if (top + tooltipRect.height > window.innerHeight - 4) {
    top = window.innerHeight - tooltipRect.height - 4;
  }

  gutterTooltipEl.style.top = top + 'px';
  gutterTooltipEl.style.left = (gutterRect.right + 8) + 'px';
}

function hideGutterTooltip() {
  if (gutterTooltipTimer) clearTimeout(gutterTooltipTimer);
  gutterTooltipTimer = setTimeout(() => {
    if (gutterTooltipEl) {
      gutterTooltipEl.remove();
      gutterTooltipEl = null;
    }
    gutterTooltipTimer = null;
  }, 150);
}

// Gutter hover events (delegated) — use mousemove to track line changes
let lastTooltipLine = 0;

gutter.addEventListener('mousemove', (e) => {
  if (gutter._tooltipRaf) return;
  gutter._tooltipRaf = requestAnimationFrame(() => {
    gutter._tooltipRaf = null;
    const lineDiv = e.target.closest('.gutter-line');
    if (!lineDiv) return;
    const lineNum = parseInt(lineDiv.dataset.line, 10);
    if (lineNum && lineNum !== lastTooltipLine && state.compileErrors[lineNum]) {
      lastTooltipLine = lineNum;
      showGutterTooltip(e);
    }
  });
}, true);

gutter.addEventListener('mouseleave', () => {
  lastTooltipLine = 0;
  hideGutterTooltip();
}, true);

// Close tooltip when clicking anywhere
// (We want to preserve existing mousedown handler for autocomplete)

// Close autocomplete when clicking outside
document.addEventListener('mousedown', (e) => {
  if (!autocompleteWrapper.contains(e.target) && e.target !== codeInput) {
    hideAutocomplete();
  }
});

codeInput.addEventListener('keydown', (e) => {
  // ── Autocomplete navigation ──
  if (autocompleteState.active) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectAutocompleteNext();
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectAutocompletePrev();
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      applyAutocomplete();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      hideAutocomplete();
      return;
    }
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const start = codeInput.selectionStart;
    const end = codeInput.selectionEnd;
    const text = codeInput.value;

    if (e.shiftKey) {
      const lineStart = text.lastIndexOf('\n', start - 1) + 1;
      const line = text.substring(lineStart);
      if (line.startsWith('    ')) {
        codeInput.value = text.substring(0, lineStart) + line.substring(4) + text.substring(end);
        codeInput.selectionStart = codeInput.selectionEnd = Math.max(start - 4, lineStart);
      }
    } else {
      codeInput.value = text.substring(0, start) + '    ' + text.substring(end);
      codeInput.selectionStart = codeInput.selectionEnd = start + 4;
    }
    syncEditor();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
    e.preventDefault();
    loadFile();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
    e.preventDefault();
    openDocs();
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    const start = codeInput.selectionStart;
    const text = codeInput.value;
    const lineStart = text.lastIndexOf('\n', start - 1) + 1;
    const currentLine = text.substring(lineStart, start);
    const indent = currentLine.match(/^(\s*)/)[1];

    let insertion = '\n' + indent;
    codeInput.value = text.substring(0, start) + insertion + text.substring(codeInput.selectionEnd);
    codeInput.selectionStart = codeInput.selectionEnd = start + insertion.length;

    // Extra indent after "then:"
    if (currentLine.trim() === 'then:') {
      codeInput.value = codeInput.value.substring(0, start + insertion.length) + '    ' + codeInput.value.substring(start + insertion.length);
      codeInput.selectionStart = codeInput.selectionEnd = start + insertion.length + 4;
    }

    syncEditor();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
    e.preventDefault();
    const start = codeInput.selectionStart;
    const text = codeInput.value;
    const lineStart = text.lastIndexOf('\n', start - 1) + 1;
    const lineEnd = text.indexOf('\n', start);
    const endPos = lineEnd === -1 ? text.length : lineEnd;
    const line = text.substring(lineStart, endPos);
    const nl = lineEnd === -1 ? '\n' : '';
    codeInput.value = text.substring(0, endPos) + nl + line + text.substring(endPos);
    syncEditor();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === '/') {
    e.preventDefault();
    const start = codeInput.selectionStart;
    const text = codeInput.value;
    const lineStart = text.lastIndexOf('\n', start - 1) + 1;
    const lineEnd = text.indexOf('\n', start);
    const endPos = lineEnd === -1 ? text.length : lineEnd;
    const lineRange = text.substring(lineStart, endPos);

    if (lineRange.trim().startsWith('//')) {
      codeInput.value = text.substring(0, lineStart) + lineRange.replace(/^\s*\/\//, '') + text.substring(endPos);
    } else {
      const ws = lineRange.match(/^(\s*)/)[1];
      codeInput.value = text.substring(0, lineStart) + ws + '// ' + lineRange.trim() + text.substring(endPos);
    }
    syncEditor();
    return;
  }

  setTimeout(updateCursorInfo, 0);
});

function toggleSidebar(view) {
  if (state.sidebarView === view && !state.sidebarCollapsed) {
    state.sidebarCollapsed = true;
    sidebarPanel.classList.add('collapsed');
    document.querySelectorAll('.activity-bar-btn').forEach(b => b.classList.remove('active'));
    return;
  }
  state.sidebarCollapsed = false;
  state.sidebarView = view;
  sidebarPanel.classList.remove('collapsed');
  document.querySelectorAll('.activity-bar-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btnFiles');
  if (btn) btn.classList.add('active');
  updateFileList();
}

function addRecentFile(fileName, jsonObj) {
  state.recentFiles = state.recentFiles.filter(f => f.name !== fileName);
  state.recentFiles.unshift({ name: fileName, data: jsonObj });
  if (state.recentFiles.length > 20) state.recentFiles.pop();
  updateFileList();
}

function switchToFile(fileName) {
  const file = state.recentFiles.find(f => f.name === fileName);
  if (!file) return;
  state.fileName = fileName;
  state.sourceJson = file.data;
  codeInput.value = jsonToPseudo(file.data);
  syncEditor();
  fileNameDisplay.style.display = 'inline-flex';
  fileNameText.textContent = fileName;
  updateFileList();
}

function closeFile(fileName, e) {
  e.stopPropagation();
  state.recentFiles = state.recentFiles.filter(f => f.name !== fileName);
  if (state.fileName === fileName) {
    if (state.recentFiles.length > 0) {
      switchToFile(state.recentFiles[0].name);
    } else {
      state.fileName = null;
      state.sourceJson = null;
      codeInput.value = '';
      syncEditor();
      fileNameDisplay.style.display = 'none';
    }
  }
  updateFileList();
}

function closeAllFiles() {
  state.recentFiles = [];
  state.fileName = null;
  state.sourceJson = null;
  codeInput.value = '';
  syncEditor();
  fileNameDisplay.style.display = 'none';
  updateFileList();
}

function updateFileList() {
  if (!fileList) return;
  if (state.recentFiles.length === 0) {
    fileList.innerHTML = '<div class="file-list-empty">No open files<br>Click 📁 or use Ctrl+O to open a JSON file</div>';
    return;
  }
  let html = '';
  for (const file of state.recentFiles) {
    const active = file.name === state.fileName ? ' active' : '';
    const safe = file.name.replace(/'/g, "\\'");
    html += '<div class="file-list-item' + active + '" onclick="switchToFile(\'' + safe + '\')">';
    html += '  <span class="file-icon">📄</span>';
    html += '  <span>' + escapeHtml(file.name) + '</span>';
    html += '  <button class="file-close" onclick="closeFile(\'' + safe + '\', event)" title="Close">✕</button>';
    html += '</div>';
  }
  fileList.innerHTML = html;
}

// ================================================================
//  COMPILE — Line-by-Line Validation
// ================================================================

function compileScript() {
  const text = codeInput.value;
  const lines = text.split('\n');
  const errors = [];
  const warnings = [];
  const infos = [];

  if (text.trim() === '') {
    errors.push({ line: 1, text: 'Editor is empty — nothing to compile.' });
    showCompileLog(errors, warnings, infos);
    return;
  }

  // Track trigger block boundaries for context
  let inTrigger = false;
  let inCondition = false;
  let inActions = false;


  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const trimmed = rawLine.trim();
    const lineNum = i + 1;

    // Skip empty lines and comments
    if (trimmed === '' || trimmed.startsWith('//')) continue;

    // ── Metadata line (@key: value) ──
    if (trimmed.startsWith('@')) {
      const colonIdx = trimmed.indexOf(':');
      if (colonIdx === -1) {
        errors.push({ line: lineNum, text: 'Metadata line missing colon.' });
        continue;
      }
      const key = trimmed.slice(1, colonIdx).trim();
      if (!key) {
        errors.push({ line: lineNum, text: 'Empty metadata key after @.' });
        continue;
      }
      if (!META_KEYS.includes(key)) {
        warnings.push({ line: lineNum, text: 'Unknown metadata key "' + key + '". Not recognized by the editor — will be preserved as-is.' });
      }
      inTrigger = false; inCondition = false; inActions = false;
      continue;
    }

    // ── Trigger event line (on ...) ──
    if (trimmed.startsWith('on ')) {
      const match = trimmed.match(/^on\s+([a-zA-Z_-]+)/);
      if (!match) {
        errors.push({ line: lineNum, text: 'Invalid event syntax. Expected: on <event-type>(<args>)' });
        continue;
      }
      const eventType = match[1];
      if (!EVENT_TYPES.has(eventType)) {
        errors.push({ line: lineNum, text: 'Unknown event type "' + eventType + '".' });
      }
      // Check for unmatched parentheses
      const parens = trimmed.match(/\(/g) || [];
      const closeParens = trimmed.match(/\)/g) || [];
      if (parens.length !== closeParens.length) {
        errors.push({ line: lineNum, text: 'Unmatched parentheses in event declaration.' });
      }
      currentEventLine = lineNum;
      currentEventType = eventType;
      inTrigger = true;
      inCondition = false;
      inActions = false;
      continue;
    }

    // ── Condition line (if ...) ──
    if (trimmed.startsWith('if ')) {
      if (!inTrigger) {
        errors.push({ line: lineNum, text: 'Condition outside of a trigger block. Place after an "on" line.' });
        continue;
      }
      const content = trimmed.slice(3).trim();
      if (!content) {
        errors.push({ line: lineNum, text: 'Empty condition after "if".' });
        continue;
      }
      // Check each condition in the chain
      const parts = content.split(/\s+(and|or)\s+/);
      for (let p = 0; p < parts.length; p++) {
        const part = parts[p].trim();
        if (part === 'and' || part === 'or') continue;
        const condMatch = part.match(/^([a-zA-Z_-]+)\s*(?:\(([^)]*)\))?\s*$/);
        if (!condMatch) {
          errors.push({ line: lineNum, text: 'Invalid condition syntax: "' + part + '". Expected: <condition-type>(<args>)' });
          continue;
        }
        const condType = condMatch[1];
        if (!CONDITION_TYPES.has(condType)) {
          errors.push({ line: lineNum, text: 'Unknown condition type "' + condType + '".' });
        }
        // Check paren balance
        const condParens = (condMatch[2] || '').match(/\(/g) || [];
        const condCloseParens = (condMatch[2] || '').match(/\)/g) || [];
        if (condParens.length !== condCloseParens.length) {
          errors.push({ line: lineNum, text: 'Unmatched parentheses in condition arguments.' });
        }
      }
      inCondition = true;
      inActions = false;
      continue;
    }

    // ── "then:" line ──
    if (trimmed === 'then:' || trimmed.startsWith('then:')) {
      if (!inTrigger) {
        errors.push({ line: lineNum, text: '"then:" outside of a trigger block.' });
        continue;
      }
      inActions = true;
      inCondition = false;
      continue;
    }

    // ── Action line (indented, after then:) ──
    const indent = rawLine.search(/\S/);
    if (indent >= 4 && inActions) {
      const actionMatch = trimmed.match(/^([a-zA-Z_-]+)\s*(?:\(([^)]*)\))?\s*$/);
      if (!actionMatch) {
        errors.push({ line: lineNum, text: 'Invalid action syntax: "' + trimmed + '". Expected: <action-type>(<args>)' });
        continue;
      }
      const actionType = actionMatch[1];
      if (!ACTION_TYPES.has(actionType)) {
        errors.push({ line: lineNum, text: 'Unknown action type "' + actionType + '".' });
      }
      // Check paren balance
      const actionParens = (actionMatch[2] || '').match(/\(/g) || [];
      const actionCloseParens = (actionMatch[2] || '').match(/\)/g) || [];
      if (actionParens.length !== actionCloseParens.length) {
        errors.push({ line: lineNum, text: 'Unmatched parentheses in action arguments.' });
      }
      continue;
    }

    // ── Indented line that doesn't match known patterns ──
    if (indent >= 4) {
      warnings.push({ line: lineNum, text: 'Indented line does not match known trigger/action syntax: "' + trimmed + '".' });
      continue;
    }

    // ── Line we can't classify ──
    warnings.push({ line: lineNum, text: 'Unrecognized line content: "' + trimmed + '".' });
  }

  // If no errors, try to generate JSON and validate round-trip
  let jsonResult = null;
  if (errors.length === 0) {
    try {
      jsonResult = pseudoToJson(text);
      // Check if JSON generates valid pseudo (round-trip)
      try {
        const regenerated = jsonToPseudo(jsonResult);
        // Try parsing it back
        pseudoToJson(regenerated);
        infos.push({ line: 0, text: 'Round-trip validation passed — JSON can be re-imported.' });
      } catch (e) {
        warnings.push({ line: 0, text: 'JSON generated, but round-trip may have data loss: ' + e.message });
      }
    } catch (e) {
      errors.push({ line: 0, text: 'Failed to generate JSON: ' + e.message });
    }
  }

  // Generate stats
  const triggerBlocks = (jsonResult && jsonResult.trigger) ? jsonResult.trigger.length : 0;
  const metaCount = jsonResult ? Object.keys(jsonResult).filter(k => k !== 'trigger').length : 0;

  if (errors.length === 0) {
    infos.push({ line: 0, text: 'Generated ' + triggerBlocks + ' trigger(s), ' + metaCount + ' metadata field(s).' });
  }

  // Store errors in state for gutter tooltips
  state.compileErrors = {};
  state.compileErrorCount = errors.length + warnings.length;
  for (const e of errors) {
    if (e.line > 0) {
      if (!state.compileErrors[e.line]) state.compileErrors[e.line] = [];
      state.compileErrors[e.line].push({ type: 'error', text: e.text });
    }
  }
  for (const w of warnings) {
    if (w.line > 0) {
      if (!state.compileErrors[w.line]) state.compileErrors[w.line] = [];
      state.compileErrors[w.line].push({ type: 'warning', text: w.text });
    }
  }
  // Update gutter to show markers
  updateGutter(codeInput.value);

  showCompileLog(errors, warnings, infos);
}

function goToLine(lineNum) {
  if (lineNum <= 0) return;
  const text = codeInput.value;
  const lines = text.split('\n');
  let pos = 0;
  for (let i = 0; i < Math.min(lineNum - 1, lines.length); i++) {
    pos += lines[i].length + 1;
  }
  codeInput.focus();
  codeInput.selectionStart = pos;
  codeInput.selectionEnd = pos;
  codeInput.scrollTop = (lineNum - 4) * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-size')) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--line-height')));
  syncEditor();
}

function showCompileLog(errors, warnings, infos) {
  // Remove existing log modal
  const existing = document.getElementById('compileLogModal');
  if (existing) existing.remove();

  const hasErrors = errors.length > 0;
  const hasWarnings = warnings.length > 0;

  const modal = document.createElement('div');
  modal.id = 'compileLogModal';
  modal.className = 'compile-modal';

  const panel = document.createElement('div');
  panel.className = 'compile-panel';

  // ── Header ──
  const header = document.createElement('div');
  header.className = 'compile-header';

  const title = document.createElement('div');
  title.className = 'title ' + (hasErrors ? 'error' : hasWarnings ? 'warning' : 'success');
  title.innerHTML = (hasErrors ? '✗' : '✓') + ' Compilation ' + (hasErrors ? 'Failed' : 'Successful');
  header.appendChild(title);

  const stats = document.createElement('div');
  stats.className = 'stats';
  const parts = [];
  if (errors.length > 0) parts.push(errors.length + ' error(s)');
  if (warnings.length > 0) parts.push(warnings.length + ' warning(s)');
  if (infos.length > 0) parts.push(infos.length + ' info');
  stats.textContent = parts.join(', ');
  header.appendChild(stats);

  const closeBtn = document.createElement('div');
  closeBtn.className = 'compile-close';
  closeBtn.textContent = '✕';
  closeBtn.onclick = () => modal.remove();
  header.appendChild(closeBtn);
  panel.appendChild(header);

  // ── Body ──
  const body = document.createElement('div');
  body.className = 'compile-body';

  function addMsg(icon, cls, lineNum, text) {
    const msg = document.createElement('div');
    msg.className = 'compile-msg ' + cls;

    const iconSpan = document.createElement('span');
    iconSpan.className = 'icon';
    iconSpan.textContent = icon;
    msg.appendChild(iconSpan);

    const lineSpan = document.createElement('span');
    lineSpan.className = 'line-num';
    if (lineNum > 0) {
      lineSpan.textContent = 'L' + lineNum;
      lineSpan.style.cursor = 'pointer';
      lineSpan.onclick = (e) => {
        e.stopPropagation();
        goToLine(lineNum);
        modal.remove();
      };
    } else {
      lineSpan.textContent = '';
    }
    msg.appendChild(lineSpan);

    const textSpan = document.createElement('span');
    textSpan.className = 'text';
    textSpan.textContent = text;
    msg.appendChild(textSpan);

    // Click on the whole row to go to line
    if (lineNum > 0) {
      msg.onclick = () => {
        goToLine(lineNum);
        modal.remove();
      };
    }

    body.appendChild(msg);
  }

  // Show errors first
  for (const e of errors) addMsg('✗', 'error', e.line, e.text);
  // Then warnings
  for (const w of warnings) addMsg('⚠', 'warning', w.line, w.text);
  // Then info
  for (const i of infos) addMsg('ℹ', 'info', i.line, i.text);

  // If no messages at all, show success
  if (errors.length === 0 && warnings.length === 0 && infos.length === 0) {
    addMsg('✓', 'success', 0, 'No issues found — script compiles perfectly.');
  }

  panel.appendChild(body);

  // ── Footer ──
  const footer = document.createElement('div');
  footer.className = 'compile-footer';

  const closeFooterBtn = document.createElement('button');
  closeFooterBtn.className = 'btn';
  closeFooterBtn.textContent = 'Close';
  closeFooterBtn.onclick = () => modal.remove();
  footer.appendChild(closeFooterBtn);

  if (!hasErrors) {
    const previewBtn = document.createElement('button');
    previewBtn.className = 'btn btn-primary';
    previewBtn.textContent = 'Preview JSON';
    previewBtn.onclick = () => { previewJson(); modal.remove(); };
    footer.appendChild(previewBtn);
  }

  panel.appendChild(footer);
  modal.appendChild(panel);
  document.body.appendChild(modal);

  // Close on Escape
  const keyHandler = (e) => {
    if (e.key === 'Escape') { modal.remove(); document.removeEventListener('keydown', keyHandler); }
  };
  document.addEventListener('keydown', keyHandler);

  // Click outside
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
}

function saveFile() {
  try {
    const pseudo = codeInput.value;
    const jsonObj = pseudoToJson(pseudo);

    // Preserve fields from original source that might not round-trip
    if (state.sourceJson) {
      for (const [key, val] of Object.entries(state.sourceJson)) {
        if (key === 'trigger') continue;
        if (!(key in jsonObj)) {
          jsonObj[key] = val;
        }
      }
    }

    const jsonStr = JSON.stringify(jsonObj, null, 4);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = state.fileName || 'trigger-script.json';
    a.click();
    URL.revokeObjectURL(url);

    state.sourceJson = jsonObj;
    const idx = state.recentFiles.findIndex(f => f.name === state.fileName);
    if (idx >= 0) state.recentFiles[idx].data = jsonObj;
    showNotification('Saved as JSON!', 'success');
  } catch (err) {
    showNotification('Conversion error: ' + err.message, 'error');
  }
}

function highlightJson(str) {
  let s = escapeHtml(str);
  // Step 1: Highlight ALL strings as values first
  s = s.replace(/("(?:[^"\\]|\.)*")/g, '<span class="js">$1</span>');
  // Step 2: Re-color strings followed by : as keys
  s = s.replace(/<span class="js">("(?:[^"\\]|\.)*")<\/span>\s*:/g, '<span class="jk">$1</span><span class="jc">:</span>');
  // Numbers
  s = s.replace(/(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, '<span class="jn">$1</span>');
  // Booleans and null
  s = s.replace(/(true|false|null)/g, '<span class="jb">$1</span>');
  // Brace/bracket highlights
  s = s.replace(/([\[\]{}])/g, '<span class="jp">$1</span>');
  return s;
}

function previewJson() {
  try {
    const jsonObj = pseudoToJson(codeInput.value);
    if (state.sourceJson) {
      for (const [key, val] of Object.entries(state.sourceJson)) {
        if (key === 'trigger') continue;
        if (!(key in jsonObj)) jsonObj[key] = val;
      }
    }
    const jsonStr = JSON.stringify(jsonObj, null, 2);

    const existing = document.getElementById('jsonPreviewModal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'jsonPreviewModal';
    modal.style.cssText = `
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-family);
    `;

    const header = document.createElement('div');
    header.style.cssText = `
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; background: #2d2e2a;
      border-bottom: 1px solid #3e3d32;
      border-radius: 6px 6px 0 0;
      flex-shrink: 0;
      cursor: default;
      user-select: none;
    `;
    header.innerHTML = '<span style="color:var(--accent-pink);font-weight:600;font-size:12px;">△ JSON PREVIEW</span>' +
      '<button id="jpClose" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:16px;padding:0 4px;" title="Close (Esc)">✕</button>';
    header.querySelector('#jpClose').onclick = () => modal.remove();

    const pre = document.createElement('div');
    pre.style.cssText = `
      background: #1b1c18; color: #f8f8f2;
      padding: 16px 20px;
      overflow: auto;
      font-family: var(--font-family);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre;
      tab-size: 2;
      outline: none;
      flex: 1;
      min-height: 100px;
    `;
    pre.tabIndex = 0;
    pre.innerHTML = highlightJson(jsonStr);

    const resizeHandle = document.createElement('div');
    resizeHandle.style.cssText = `
      width: 16px; height: 16px;
      position: absolute; bottom: 0; right: 0;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, #49483e 50%);
      border-radius: 0 0 6px 0;
    `;

    const container = document.createElement('div');
    container.style.cssText = `
      display: flex; flex-direction: column;
      background: #1b1c18;
      border: 1px solid #3e3d32;
      border-radius: 6px;
      width: min(80vw, 900px);
      height: min(80vh, 700px);
      min-width: 400px;
      min-height: 250px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      overflow: hidden;
    `;

    // Resize logic
    let isResizing = false;
    let startX, startY, startW, startH;

    resizeHandle.addEventListener('mousedown', (e) => {
      isResizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startW = container.offsetWidth;
      startH = container.offsetHeight;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing || !container.parentNode) return;
      const w = Math.max(400, startW + (e.clientX - startX));
      const h = Math.max(250, startH + (e.clientY - startY));
      container.style.width = w + 'px';
      container.style.height = h + 'px';
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
    });

    container.appendChild(header);
    container.appendChild(pre);
    container.appendChild(resizeHandle);
    modal.appendChild(container);
    document.body.appendChild(modal);

    modal.onclick = (e) => { if (e.target === modal) { isResizing = false; modal.remove(); } };
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Escape') { modal.remove(); document.removeEventListener('keydown', handler); }
    });

    // Focus and allow keyboard copy
    setTimeout(() => pre.focus(), 50);
  } catch (err) {
    showNotification('Error: ' + err.message, 'error');
  }
}

function loadExample() {

// ║  Duq Trigger Editor — Example    ║

// ─── Simple initialization trigger ───
on initialization
        then:
            delete-save()
            set-global-variable("sandbox", true)
            set-gold-all-players(999999)
            system-sleep(float: 1.0)
            game-select-subclass()

// ─── Trigger with conditions ───
on call-event
    if player-control-type(int: 0) and get-game-context("show-controls")
        then:
            set-game-context("none")
            text-messagebox("interface/icon-info", "MAIN-MENU", "HINT-CAPTION", "HUD", "HINT-0")

// ─── Multiple events + cinematic sequence ───
on initialization
        then:
            unit-hide(unit: "hero", float: 99999.0)
            music-change("intro")
            game-event-change(int: 3)
            system-sleep(float: 1.5)
            spawn-unit("characters/npcs/mage", "neutral", "mage", x: 1420, y: 2140, summon: false)
            add-sfx("particles/dust-decay", x: 1460, y: 2190)
            system-sleep(float: 1.0)
            text-dialogbox("mage", "UNITS", "MAGE-CAPTION", "MAGE", "BEGIN-1")
            unit-unhide(unit: "hero")
            game-event-change(int: 1)

// ─── Unit kill event ───
on unit-kill(unit: "boss-1")
        then:
            system-sleep(float: 2.0)
            set-global-variable("boss-1", true)
            set-game-context("rewards")
            text-messagebox("MAIN-MENU", "INFO-CAPTION", "HUD", "INFO-BOSS-RUN-BREAK")
            call-event()

// ─── Region entered ───
on region-entered(unit: "hero", id: 10)
    if get-game-context("battle")
        then:
            call-event()
            trigger-reset()

// ─── With OR conditions ───
on unit-kill(unit: "boss-3a")
    if get-global-variable("boss-2") or get-global-variable("boss-3")
        then:
            system-sleep(float: 2.0)
            set-game-context("rewards")
            call-event()

@procedural: false
@unit-spawn-range: 500
@unit-spawn-limit: 10
@exit: ""
`;

// ========== SPLASH SCREEN ==========
function hideSplash() {
  const splash = document.getElementById("splash");
  if (!splash || splash.classList.contains("hiding")) return;
  splash.classList.add("hiding");
  setTimeout(() => splash.remove(), 500);
}

// Auto-hide splash after 2 seconds
setTimeout(hideSplash, 2000);

// Also hide splash early if user clicks it
const splashEl = document.getElementById("splash");
if (splashEl) {
  splashEl.addEventListener("click", hideSplash);
}

</script>
<script src="/static/persist.js"></script>
<script>
(function() {
  var KEY = 'trigger_editor_state';
  if (window.duqPersist) {
    var saved = window.duqPersist.load(KEY, null);
    if (saved && saved.text) {
      setTimeout(function() {
        codeInput.value = saved.text;
        syncEditor();
      }, 100);
    }
    // Debounced auto-save on input
    var saveTimer = null;
    var origInput = codeInput.addEventListener;
    codeInput.addEventListener('input', function() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function() {
        window.duqPersist.save(KEY, { text: codeInput.value });
        saveTimer = null;
      }, 600);
    });
  }
})();
</script>
