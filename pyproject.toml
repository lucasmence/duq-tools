[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
# Target Python version
target-version = "py311"

# Files to exclude
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "*.spec",        # PyInstaller spec files (use PyInstaller conventions)
    "main.py",       # Old PySide6 desktop app (not used)
    "get-pip.py",    # Third-party script
]

[tool.ruff.lint]
# Enable unused import detection (F) and pycodestyle errors (E)
select = ["F", "E4", "E7", "W"]

# Ignore line length for now
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test files can use unused imports for fixtures
"tests/*" = ["F401"]
