name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  #  TEST  —  Run the pytest suite
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  #  WINDOWS BUILD  —  Create duq-tools.exe via PyInstaller
  # ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: [test]
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm --clean

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: duq-tools-windows
          path: dist/duq-tools.exe
          if-no-files-found: error
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  #  RELEASE  —  Create GitHub Release with auto-generated notes
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [windows]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: duq-tools-windows
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-artifacts/duq-tools.exe
