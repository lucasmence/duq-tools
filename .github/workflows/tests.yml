name: Tests

on:
  pull_request:

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  #  WINDOWS BUILD CHECK  —  Verify PyInstaller builds on PRs
  # ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: Check Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm --clean

      - name: Verify executable exists
        run: |
          if (Test-Path "dist/duq-tools.exe") {
            Write-Output "✅ Executable created successfully"
            Get-Item "dist/duq-tools.exe" | Select-Object Length, LastWriteTime
          } else {
            Write-Error "❌ Executable not found!"
            exit 1
          }
