version: 2
updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    # Limit to security and patch updates for actions
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # ── Python (pip) ────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group non-breaking dependency updates into single PRs
    groups:
      flask:
        patterns:
          - "flask*"
          - "werkzeug"
          - "jinja2"
          - "markupsafe"
          - "itsdangerous"
          - "click"
          - "blinker"
      testing:
        patterns:
          - "pytest*"
          - "coverage"
